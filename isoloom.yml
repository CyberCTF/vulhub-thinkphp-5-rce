# yaml-language-server: $schema=https://www.isoloom.com/schema/v1.json
# ThinkPHP 5 Remote Code Execution (Vulhub, by phith0n and the Vulhub contributors) as an Isoloom spec:
# Vulhub's thinkphp/5-rce, vendored in app/, run from the published image vulhub/thinkphp:5.0.20.
# `isoloom generate`, then `isoloom run docker`.
version: 1
name: vulhub-thinkphp-5-rce

# Given by the CyberCTF launcher: this player's flag. Without it the development flag.
inputs: [CTF_FLAG_MAIN]

networks:
  lab: { cidr: 10.60.52.0/24, internet: false }

machines:
  web:
    networks: { lab: 10 }
    services: [{ port: 80, name: web, http: true, publish: 8080 }]
    resources: { cpus: 1, memory_mb: 256 }
    inputs: [CTF_FLAG_MAIN]
    volumes: { ctf: /ctf }   # the flag, written by ctf/flag.sh at every start
    docker:
      image: vulhub/thinkphp:5.0.20
      init: [ctf/flag.sh]

checks:
  - name: ThinkPHP answers
    http: http://web/
    wait: 120
  - name: the default page is ThinkPHP 5
    script: checks/version.sh

message: |
  ThinkPHP 5.0.20 answers at http://localhost:{{ machines.web.services.0.publish }}/.
  Without forced routing, the s parameter picks the module, controller and action.
